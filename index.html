<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECO 210: Transport Economics — CBT Practice</title>
<style>
  :root{
    --bg:#05101f;
    --card:#0d1f38;
    --border:#1e3a5f;
    --accent:#38bdf8;
    --text:#f1f5f9;
    --muted:#64748b;
    --muted2:#94a3b8;
    --green:#22c55e;
    --green-bg:#052e16;
    --green-border:#22c55e;
    --green-text:#86efac;
    --red:#ef4444;
    --red-bg:#2d0a0a;
    --red-border:#ef4444;
    --red-text:#fca5a5;
    --amber:#f59e0b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Segoe UI', system-ui, sans-serif;
    color:var(--text);
    min-height:100vh;
  }
  .screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .hidden{display:none !important;}

  /* ===== HOME ===== */
  #home .wrap{max-width:660px;width:100%;text-align:center;}
  .emoji-row{font-size:52px;margin-bottom:8px;}
  .eyebrow{color:var(--muted);font-size:12px;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;}
  h1{color:var(--text);font-size:30px;font-weight:900;margin:0 0 6px;line-height:1.2;}
  h2.sub{color:var(--accent);font-size:18px;font-weight:700;margin:0 0 24px;}

  .stats-grid{
    background:var(--card);
    border-radius:16px;
    padding:18px 22px;
    margin-bottom:24px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
  }
  .stat{text-align:center;}
  .stat .v{color:var(--accent);font-size:26px;font-weight:900;}
  .stat .l{color:var(--muted);font-size:11px;}

  .select-label{color:var(--muted2);font-size:12px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{
    padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);
    font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;
    background:transparent;color:var(--muted);
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--bg);}
  .chip-info{color:var(--muted2);font-size:12px;margin-top:10px;}

  .start-btn{
    background:var(--accent);color:var(--bg);border:none;border-radius:14px;
    padding:16px 0;font-size:16px;font-weight:900;cursor:pointer;
    width:100%;max-width:360px;letter-spacing:.5px;margin-top:22px;
  }
  .footnote{color:#334155;font-size:11px;margin-top:14px;}

  /* ===== SUMMARY ===== */
  #summary .wrap{max-width:580px;width:100%;text-align:center;}
  .summary-emoji{font-size:52px;margin-bottom:12px;}
  .summary-grade{font-size:18px;font-weight:800;margin-bottom:24px;}
  .score-card{background:var(--card);border-radius:20px;padding:28px;margin-bottom:24px;}
  .score-pct{color:var(--accent);font-size:60px;font-weight:900;}
  .score-sub{color:#cbd5e1;font-size:14px;margin-bottom:16px;}
  .bar-track{background:var(--border);border-radius:100px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:100px;}

  .breakdown{background:var(--card);border-radius:16px;padding:18px 20px;margin-bottom:24px;text-align:left;}
  .breakdown-title{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;}
  .bd-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bd-ch{color:var(--muted);font-size:11px;width:68px;flex-shrink:0;}
  .bd-track{flex:1;background:var(--border);border-radius:100px;height:5px;overflow:hidden;}
  .bd-fill{height:100%;border-radius:100px;}
  .bd-score{color:var(--text);font-size:11px;width:44px;text-align:right;}

  .summary-actions{display:flex;gap:12px;}
  .btn{
    flex:1;border-radius:12px;padding:14px;font-size:13px;cursor:pointer;
  }
  .btn-outline-accent{background:transparent;color:var(--accent);border:1.5px solid var(--accent);font-weight:700;}
  .btn-fill-accent{background:var(--accent);color:var(--bg);border:none;font-weight:800;}
  .btn-outline-muted{background:transparent;color:var(--muted2);border:1.5px solid #334155;font-weight:700;}

  /* ===== QUIZ ===== */
  #quiz{align-items:stretch;justify-content:flex-start;padding:16px 16px 40px;}
  #quiz .wrap{max-width:700px;margin:0 auto;width:100%;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .home-link{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0;}
  .qcount{color:var(--muted);font-size:13px;}
  .qcount b{color:var(--accent);font-weight:800;}
  .score-display{color:var(--green);font-size:13px;font-weight:800;}

  .progress-track{background:var(--card);border-radius:100px;height:4px;margin-bottom:18px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:100px;transition:width .3s;}

  .badges{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .badge-ch{background:var(--card);color:var(--accent);font-size:10px;padding:4px 10px;border-radius:20px;font-weight:700;}
  .badge-topic{background:var(--card);color:var(--muted);font-size:10px;padding:4px 10px;border-radius:20px;}

  .question-box{background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:14px;}
  .question-label{color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  .question-text{color:var(--text);font-size:15px;line-height:1.65;margin:0;font-weight:500;}

  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .option{
    background:var(--card);border:1.5px solid var(--border);border-radius:12px;
    padding:13px 16px;text-align:left;cursor:pointer;color:#cbd5e1;font-size:13px;
    line-height:1.55;display:flex;align-items:flex-start;gap:10px;transition:all .15s;
  }
  .option .letter{font-weight:800;flex-shrink:0;font-size:12px;}
  .option .opt-text{flex:1;}
  .option .mark{flex-shrink:0;font-size:14px;}
  .option.selected{background:#1e3a5f;border-color:var(--accent);color:#e0f2fe;}
  .option.correct{background:var(--green-bg);border-color:var(--green-border);color:var(--green-text);}
  .option.incorrect{background:var(--red-bg);border-color:var(--red-border);color:var(--red-text);}
  .option.disabled{cursor:default;}
  .mark-correct{color:var(--green);}
  .mark-incorrect{color:var(--red);}

  .explanation{background:#071a30;border:1px solid #1e4a6a;border-radius:12px;padding:15px 17px;margin-bottom:14px;}
  .explanation-title{color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .explanation-text{color:var(--muted2);font-size:12px;line-height:1.7;margin:0;}

  .nav-row{display:flex;gap:12px;}
  .nav-prev{
    flex:1;background:transparent;border:1.5px solid var(--border);border-radius:12px;
    padding:13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);
  }
  .nav-prev:disabled{color:var(--border);cursor:not-allowed;}
  .nav-next{
    flex:2;background:var(--accent);color:var(--bg);border:none;border-radius:12px;
    padding:13px;font-size:14px;font-weight:900;cursor:pointer;
  }
</style>
</head>

  <div class="wrap">
    <div class="emoji-row">🚌🚂✈️🚢</div>

</div>

<div id="summary" class="screen hidden">

    <div class="score-card">
      <div class="score-pct" id="summaryPct"></div>

<script>
const ALL_QUESTIONS = [
  // ── CHAPTER 1: Introduction to Transport Economics ──────────────────────────
  {
    id: 1, ch: "Ch.1", topic: "Definition & Scope",
    q: "According to the manual, Transport Economics is defined as a branch of economics that focuses on the:",
    opts: ["A. Regulation of vehicle manufacturing standards", "B. Efficient allocation of resources in the transportation sector", "C. Collection of government taxes from transport operators", "D. Financing of road construction projects"],
    ans: "B",
    exp: "The manual explicitly defines Transport Economics as 'a branch of economics that focuses on the efficient allocation of resources in the transportation sector.'"
  },
  {
    id: 2, ch: "Ch.1", topic: "Economic Characteristics",
    q: "The manual identifies which of the following as the MOST IMPORTANT characteristic of transport?",
    opts: ["A. Transport is a luxury good demanded for pleasure", "B. Transport demand takes place over space and time", "C. Transport is not really demanded in its own right — it is a derived demand", "D. Transport is always provided by the public sector"],
    ans: "C",
    exp: "The manual states: 'The most important characteristic of transport is that it is not really demanded in its own right.' People travel to gain benefit at the destination — the demand is derived."
  },
  {
    id: 3, ch: "Ch.1", topic: "Economic Characteristics",
    q: "Transport demand 'takes place over space and time.' This characteristic distinguishes transport economics from other branches of economics because:",
    opts: ["A. Transport services can be stored for future use", "B. Transport journeys are made over a particular distance between start and end points and take a particular amount of time", "C. Transport is only relevant to urban economies", "D. Transport services have unlimited capacity"],
    ans: "B",
    exp: "The manual notes that transport demand taking place over space and time 'distinguishes transport economics from other branches of economics.' Journeys cover distance and consume time."
  },
  {
    id: 4, ch: "Ch.1", topic: "Economic Characteristics",
    q: "According to the manual, the fixed component of transport consists of:",
    opts: ["A. Vehicles and drivers", "B. Fuel and maintenance costs", "C. Infrastructure", "D. Operations and scheduling"],
    ans: "C",
    exp: "The manual states: 'Transport is often divided into fixed and mobile component; the fixed component consists of infrastructure and the mobile component consist of vehicles and operations.'"
  },
  {
    id: 5, ch: "Ch.1", topic: "Importance in Development",
    q: "The manual states that 'transport by itself is not a sufficient condition for development.' What does the lack of transport infrastructure represent?",
    opts: ["A. A sufficient condition for economic growth", "B. A constraining factor on development", "C. An irrelevant variable in economic planning", "D. A positive indicator of environmental health"],
    ans: "B",
    exp: "The manual explicitly states: 'Transport by itself is not sufficient condition for development; however, the lack of transport infrastructure can be seen as a constraining factor on development.'"
  },
  {
    id: 6, ch: "Ch.1", topic: "Roles of Transport",
    q: "The manual identifies the role of transportation in production as enabling entrepreneurs to:",
    opts: ["A. Reduce their workforce and automate production entirely", "B. Assemble raw materials and labour inputs more easily, and enable Just-in-Time (JIT) production", "C. Avoid paying taxes by relocating factories", "D. Produce goods without any capital investment"],
    ans: "B",
    exp: "The manual states transport 'enables the entrepreneur to assemble more easily the raw material and labour input needed' and 'enables Just in Time (JIT) production techniques,' reducing stock levels and unit costs."
  },
  {
    id: 7, ch: "Ch.1", topic: "Roles of Transport",
    q: "According to the manual, transportation contributes to employment through:",
    opts: ["A. Only direct employment in driving and piloting", "B. Both direct employment (e.g., drivers, pilots) and indirect employment (e.g., insurance and financing industries)", "C. Exclusively government jobs in planning departments", "D. Temporary seasonal farm work only"],
    ans: "B",
    exp: "The manual states transport job creation 'can either be direct or indirect. Direct employment will be created in the industry itself, such as drivers, logistics managers and pilots. Indirectly, jobs are created in for example the insurance and financing industry.'"
  },
  {
    id: 8, ch: "Ch.1", topic: "Roles of Transport",
    q: "The concept of 'Transportation vis-à-vis Geographical Specialization' in the manual means that:",
    opts: ["A. Every region must produce all goods it consumes", "B. Transport development has enabled regions to specialise in producing their most efficient output, with production and consumption occurring in different locations", "C. Geography prevents trade between regions", "D. Specialisation reduces economic productivity"],
    ans: "B",
    exp: "The manual explains that transport 'has enabled regions to specialise in producing its most efficient output. Production and consumption of products can take place in two different locations.'"
  },
  {
    id: 9, ch: "Ch.1", topic: "Roles of Transport",
    q: "Transport has enabled countries to practice comparative advantage in international trade by:",
    opts: ["A. Forcing all countries to produce the same goods", "B. Enabling nations or regions to specialise in producing whatever they can do best", "C. Preventing imports from competing countries", "D. Standardising wages across all trading nations"],
    ans: "B",
    exp: "The manual states: 'International transportation has led the way to more world trade, and it has enabled nations or regions to specialise in producing whatever it can do best (comparative advantage).'"
  },
  {
    id: 10, ch: "Ch.1", topic: "Scope of Transport Economics",
    q: "According to the manual, transport economics is often linked to land use planning because:",
    opts: ["A. Transport economists also design buildings", "B. Following why people travel traces changes in the location of facilities", "C. Land use laws control all transport routes", "D. Transport economics is a subset of urban architecture"],
    ans: "B",
    exp: "The manual states: 'Transport economics is therefore often linked to other disciplines such as land use planning since, if we follow the examples listed, we can trace some of the changes that have taken place in the location of those facilities.'"
  },
  {
    id: 11, ch: "Ch.1", topic: "Scope of Transport Economics",
    q: "The uneven distribution of transport demand across a network can cause:",
    opts: ["A. Perfectly balanced supply", "B. Traffic congestion", "C. Reduced fuel consumption", "D. Lower infrastructure costs"],
    ans: "B",
    exp: "The manual states: 'The reality though is that this demand is not spread evenly throughout the network. This uneven demand can cause traffic congestion.'"
  },
  {
    id: 12, ch: "Ch.1", topic: "Relationship with Other Sectors",
    q: "According to the manual, transport helps the agriculture sector by:",
    opts: ["A. Replacing farm labour with automated systems", "B. Helping farmers get their goods to markets before they spoil, and delivering fertilizers, machinery, and seeds to farms", "C. Providing subsidies directly to farmers", "D. Determining crop prices in international markets"],
    ans: "B",
    exp: "The manual identifies agricultural transport roles: 'Distribution of Produce: Transport helps farmers get their goods to markets before they spoil. Access to Inputs: Fertilizers, machinery, and seeds are delivered to farms via transport systems.'"
  },

  // ── CHAPTER 2: Demand and Supply in Transportation ───────────────────────────
  {
    id: 13, ch: "Ch.2", topic: "Transport Demand",
    q: "The manual defines transport demand as:",
    opts: ["A. The total revenue earned by transport companies in a given year", "B. The need and willingness of individuals or businesses to use transportation services to move from one location to another", "C. The number of vehicles registered in a country", "D. Government spending on transport infrastructure"],
    ans: "B",
    exp: "The manual's exact definition: 'Transport demand refers to the need and willingness of individuals or businesses to use transportation services to move from one location to another.'"
  },
  {
    id: 14, ch: "Ch.2", topic: "Transport Demand",
    q: "The manual notes that the COVID-19 outbreak 'significantly reduced transport demand, reshaping commuting and travel patterns worldwide.' This illustrates that transport demand is:",
    opts: ["A. Completely stable and unaffected by external events", "B. Highly dynamic, influenced by economic conditions, population growth, urbanization, and global events", "C. Only affected by government policy changes", "D. Determined solely by fuel prices"],
    ans: "B",
    exp: "The manual states transport demand 'is also highly dynamic, influenced by economic conditions, population growth, urbanization, and even global events such as pandemics,' citing COVID-19 as a real example."
  },
  {
    id: 15, ch: "Ch.2", topic: "Determinants of Demand",
    q: "Which of the following is listed in the manual as a determinant of transport demand?",
    opts: ["A. The colour of transport vehicles", "B. The nationality of transport operators", "C. Income levels, population growth, urbanization, and technological advancements", "D. The personal preferences of government ministers"],
    ans: "C",
    exp: "The manual lists factors influencing transport demand as 'income levels, population growth, urbanization, and technological advancements' among others."
  },
  {
    id: 16, ch: "Ch.2", topic: "Transport Supply",
    q: "The manual defines supply in transportation as referring to:",
    opts: ["A. The number of passengers who travelled last year", "B. The infrastructure, vehicles, and services available to facilitate movement", "C. The total revenue collected from transport fares", "D. The government's transport budget allocation"],
    ans: "B",
    exp: "The manual states: 'Supply in transportation refers to the infrastructure, vehicles, and services available to facilitate movement.'"
  },
  {
    id: 17, ch: "Ch.2", topic: "Transport Supply",
    q: "According to the manual, transport supply is described as 'relatively rigid, especially in the short term' because:",
    opts: ["A. Transport operators are unwilling to increase capacity under any circumstances", "B. Expanding road networks or adding train lines takes time, funding, and political will", "C. Demand for transport never changes", "D. Government regulations freeze supply permanently"],
    ans: "B",
    exp: "The manual explains: 'Transport supply is relatively rigid, especially in the short term. Expanding road networks or adding train lines takes time, funding, and political will.'"
  },
  {
    id: 18, ch: "Ch.2", topic: "Elasticity",
    q: "The manual defines elasticity of demand for transport services as measuring:",
    opts: ["A. The physical flexibility of transport vehicles", "B. How much the quantity of transport services demanded changes in response to a change in price or other factors", "C. The government's ability to change transport regulations", "D. The speed at which new roads can be built"],
    ans: "B",
    exp: "The manual states: 'Elasticity of demand for transport services measures how much the quantity of transport services demanded changes in response to a change in price or other factors.'"
  },
  {
    id: 19, ch: "Ch.2", topic: "Elasticity — Price",
    q: "According to the manual, price elasticity of transport demand refers to how sensitive demand is to changes in:",
    opts: ["A. Population size", "B. The cost of using a specific mode of transport", "C. Government investment levels", "D. The number of transport providers"],
    ans: "B",
    exp: "The manual: 'Price Elasticity of Transport Demand: This refers to how sensitive the demand for a specific mode of transportation (like buses, trains, or flights) is to changes in its cost.'"
  },
  {
    id: 20, ch: "Ch.2", topic: "Elasticity — Time",
    q: "The manual explains that time elasticity of transport demand measures:",
    opts: ["A. How prices change with the time of day", "B. How changes in travel time influence the number of people choosing a particular transport mode", "C. The length of time required to build new transport infrastructure", "D. Annual growth rates of the transport sector"],
    ans: "B",
    exp: "The manual: 'Time elasticity measures how changes in travel time influence the number of people choosing a particular transport mode.'"
  },
  {
    id: 21, ch: "Ch.2", topic: "Elasticity — Inelastic",
    q: "The manual gives daily commuters as an example of inelastic transport demand because:",
    opts: ["A. Commuters always have many transport alternatives available", "B. Commuters often have fixed routines and limited alternatives, so they keep using the same mode despite fare increases or delays", "C. Commuter transport is always free", "D. Commuters are insensitive to journey time"],
    ans: "B",
    exp: "The manual states: 'Daily commuters often have fixed routines and limited alternatives, so they may keep using the same transport mode despite fare increases or delays.'"
  },
  {
    id: 22, ch: "Ch.2", topic: "Elasticity — Elastic",
    q: "According to the manual, which type of transport most clearly demonstrates ELASTIC demand?",
    opts: ["A. Emergency ambulance services", "B. Essential work commuting", "C. Leisure air travel, where if ticket prices rise, many travellers may cancel or switch modes", "D. Freight transport where shipping costs are a minor fraction of total costs"],
    ans: "C",
    exp: "The manual gives the example: 'A good example is leisure air travel — if ticket prices rise, many travelers may choose not to fly or switch to other modes of transport.'"
  },
  {
    id: 23, ch: "Ch.2", topic: "Factors Affecting Elasticity",
    q: "The manual states that 'essential trips, such as commuting to work or school, usually show inelastic demand' because:",
    opts: ["A. Workers enjoy commuting regardless of cost", "B. Travellers have no choice but to travel", "C. Commuting is always subsidised by employers", "D. Essential trips are always short distances"],
    ans: "B",
    exp: "The manual explicitly states essential trips 'usually show inelastic demand since travellers have no choice but to travel.'"
  },
  {
    id: 24, ch: "Ch.2", topic: "Factors Affecting Elasticity",
    q: "According to the manual, how does the time horizon affect elasticity of transport demand?",
    opts: ["A. In the long term, demand becomes more inelastic as people adapt to prices", "B. In the short term demand is less elastic; over the long term people might move, change jobs, or buy different vehicles, making demand more elastic", "C. The time horizon has no effect on elasticity", "D. Short-term demand is always more elastic than long-term demand"],
    ans: "B",
    exp: "The manual: 'In the short term, people often cannot easily change their travel habits… so demand is less elastic. Over the long term, people might move closer to work, change jobs, or buy different vehicles making demand more elastic.'"
  },
  {
    id: 25, ch: "Ch.2", topic: "Equilibrium",
    q: "The manual defines equilibrium in a transportation market as the point where:",
    opts: ["A. The government sets the maximum allowable price", "B. The supply of transportation services matches the demand for them, resulting in a balanced situation", "C. All transport companies earn equal profits", "D. Road accidents are reduced to zero"],
    ans: "B",
    exp: "The manual: 'In a transportation market, equilibrium represents the point where the supply of transportation services matches the demand for them, resulting in a balanced situation.'"
  },
  {

const CHAPTERS = ["All", "Ch.1", "Ch.2", "Ch.3", "Ch.4", "Ch.5", "Ch.6", "Ch.7", "Ch.8", "Applied", "Policy", "set 2"];
const CH_LABELS = {
  "All": "All Chapters",
  "Ch.1": "Ch.1 – Introduction",
  "Ch.2": "Ch.2 – Demand & Supply",
  "Ch.3": "Ch.3 – Costs & Pricing",
  "Ch.4": "Ch.4 – Market Structures",
  "Ch.5": "Ch.5 – Modes of Transport",
  "Ch.6": "Ch.6 – Externalities",
  "Ch.7": "Ch.7 – Policy & Regulation",
  "Ch.8": "Ch.8 – International Transport",
  "Applied": "Applied Questions",
  "Policy": "Policy & Future Trends",
  "Set 2": "Set 2"
};

// ===== STATE =====
let filterCh = "All";
let questions = [];
let idx = 0;
let answered = {}; // id -> {sel, correct}
let score = 0;

// ===== ELEMENT REFS =====
const screens = {
  home: document.getElementById('home'),
  quiz: document.getElementById('quiz'),
  summary: document.getElementById('summary')
};

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
}

// ===== HOME SCREEN SETUP =====
const chipsEl = document.getElementById('chips');
const chipInfoEl = document.getElementById('chipInfo');

function filteredQuestions(){
  return filterCh === "All" ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.ch === filterCh);
}

function renderChips(){
  chipsEl.innerHTML = "";
  CHAPTERS.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (filterCh === ch ? ' active' : '');
    btn.textContent = ch === "All" ? "All (100)" : ch;
    btn.addEventListener('click', () => {
      filterCh = ch;
      renderChips();
      renderChipInfo();
    });
    chipsEl.appendChild(btn);
  });
}

function renderChipInfo(){
  const f = filteredQuestions();
  chipInfoEl.textContent = filterCh === "All"
    ? "All 100 questions selected"
    : `${f.length} question${f.length !== 1 ? "s" : ""} in ${CH_LABELS[filterCh]}`;
}

renderChips();
renderChipInfo();

document.getElementById('startBtn').addEventListener('click', startQuiz);

function startQuiz(){
  questions = [...filteredQuestions()];
  idx = 0;
  answered = {};
  score = 0;
  showScreen('quiz');
  renderQuestion();
}

// ===== QUIZ SCREEN =====
const qIdxEl = document.getElementById('qIdx');
const qTotalEl = document.getElementById('qTotal');
const qScoreEl = document.getElementById('qScore');
const progressFillEl = document.getElementById('progressFill');
const badgeChEl = document.getElementById('badgeCh');
const badgeTopicEl = document.getElementById('badgeTopic');
const questionLabelEl = document.getElementById('questionLabel');
const questionTextEl = document.getElementById('questionText');
const optionsEl = document.getElementById('options');
const explanationBoxEl = document.getElementById('explanationBox');
const explanationTextEl = document.getElementById('explanationText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

document.getElementById('quizHomeBtn').addEventListener('click', () => showScreen('home'));
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);

function renderQuestion(){
  const current = questions[idx];
  const total = questions.length;
  const alreadyDone = !!answered[current.id];
  const userSel = answered[current.id] ? answered[current.id].sel : null;

  qIdxEl.textContent = idx + 1;
  qTotalEl.textContent = total;
  qScoreEl.textContent = score;
  progressFillEl.style.width = `${((idx + 1) / total) * 100}%`;

  badgeChEl.textContent = current.ch;
  badgeTopicEl.textContent = current.topic;

  questionLabelEl.textContent = `Question ${current.id} of ${total}`;
  questionTextEl.textContent = current.q;

  // Options
  optionsEl.innerHTML = "";
  current.opts.forEach(opt => {
    const letter = opt[0];
    const isSel = userSel === letter;
    const isRight = letter === current.ans;
    const optBtn = document.createElement('button');
    optBtn.className = 'option';

    if (alreadyDone) {
      optBtn.classList.add('disabled');
      if (isRight) optBtn.classList.add('correct');
      else if (isSel && !isRight) optBtn.classList.add('incorrect');
    } else if (isSel) {
      optBtn.classList.add('selected');
    }

    const letterSpan = document.createElement('span');
    letterSpan.className = 'letter';
    letterSpan.textContent = letter + ".";

    const textSpan = document.createElement('span');
    textSpan.className = 'opt-text';
    textSpan.textContent = opt.slice(3);

    optBtn.appendChild(letterSpan);
    optBtn.appendChild(textSpan);

    if (alreadyDone && isRight) {
      const mark = document.createElement('span');
      mark.className = 'mark mark-correct';
      mark.textContent = '✓';
      optBtn.appendChild(mark);
    }
    if (alreadyDone && isSel && !isRight) {
      const mark = document.createElement('span');
      mark.className = 'mark mark-incorrect';
      mark.textContent = '✗';
      optBtn.appendChild(mark);
    }

    optBtn.addEventListener('click', () => pick(letter));
    optionsEl.appendChild(optBtn);
  });

  // Explanation
  if (alreadyDone) {
    explanationBoxEl.classList.remove('hidden');
    explanationTextEl.textContent = current.exp;
  } else {
    explanationBoxEl.classList.add('hidden');
  }

  prevBtn.disabled = idx === 0;
  nextBtn.textContent = idx === total - 1 ? "Finish & See Results →" : "Next →";
}

function pick(letter){
  const current = questions[idx];
  if (answered[current.id]) return;
  const correct = letter === current.ans;
  answered[current.id] = { sel: letter, correct };
  if (correct) score++;
  renderQuestion();
}

function goNext(){
  const total = questions.length;
  if (idx < total - 1) {
    idx++;
    renderQuestion();
  } else {
    renderSummary();
    showScreen('summary');
  }
}

function goPrev(){
  if (idx > 0) {
    idx--;
    renderQuestion();
  }
}

// ===== SUMMARY SCREEN =====
const summaryEmojiEl = document.getElementById('summaryEmoji');
const summaryGradeEl = document.getElementById('summaryGrade');
const summaryPctEl = document.getElementById('summaryPct');
const summarySubEl = document.getElementById('summarySub');
const summaryBarEl = document.getElementById('summaryBar');
const breakdownRowsEl = document.getElementById('breakdownRows');

document.getElementById('homeBtn2').addEventListener('click', () => showScreen('home'));
document.getElementById('retryBtn').addEventListener('click', startQuiz);
document.getElementById('reviewBtn').addEventListener('click', () => {
  idx = 0;
  showScreen('quiz');
  renderQuestion();
});

function renderSummary(){
  const total = questions.length;
  const pct = total > 0 ? Math.round((score / total) * 100) : 0;

  let grade, gc, emoji;
  if (pct >= 70) { grade = "PASS ✓"; gc = "#22c55e"; emoji = "🎓"; }
  else if (pct >= 50) { grade = "FAIR — REVIEW NEEDED"; gc = "#f59e0b"; emoji = "📖"; }
  else { grade = "FAIL — STUDY MORE"; gc = "#ef4444"; emoji = "📚"; }

  summaryEmojiEl.textContent = emoji;
  summaryGradeEl.textContent = grade;
  summaryGradeEl.style.color = gc;
  summaryPctEl.textContent = pct + "%";
  summarySubEl.textContent = `${score} correct out of ${total} questions`;
  summaryBarEl.style.width = pct + "%";
  summaryBarEl.style.background = gc;

  // Breakdown
  breakdownRowsEl.innerHTML = "";
  ["Ch.1","Ch.2","Ch.3","Ch.4","Ch.5","Ch.6","Ch.7","Ch.8","Applied","Policy","Set 2"].forEach(ch => {
    const cqs = ALL_QUESTIONS.filter(q => q.ch === ch && answered[q.id]);
    if (!cqs.length) return;
    const cCorrect = cqs.filter(q => answered[q.id] && answered[q.id].correct).length;
    const cpct = Math.round((cCorrect / cqs.length) * 100);
    const barColor = cpct >= 70 ? "#22c55e" : cpct >= 50 ? "#f59e0b" : "#ef4444";

    const row = document.createElement('div');
    row.className = 'bd-row';

    const chLabel = document.createElement('div');
    chLabel.className = 'bd-ch';
    chLabel.textContent = ch;

    const track = document.createElement('div');
    track.className = 'bd-track';
    const fill = document.createElement('div');
    fill.className = 'bd-fill';
    fill.style.width = cpct + "%";
    fill.style.background = barColor;
    track.appendChild(fill);

    const scoreLabel = document.createElement('div');
    scoreLabel.className = 'bd-score';
    scoreLabel.textContent = `${cCorrect}/${cqs.length}`;

    row.appendChild(chLabel);
    row.appendChild(track);
    row.appendChild(scoreLabel);
    breakdownRowsEl.appendChild(row);
  });
}
</script>
